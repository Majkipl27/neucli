meta:
  name: Nova
  description: A design-first toolkit for shipping product-grade sites from YAML.
  lang: en
  favicon: /favicon.svg

theme:
  colors:
    primary: '#7c3aed'
    accent: '#06b6d4'
    highlight: '#f472b6'
    surface: '#0f172a'
  fonts:
    heading: Inter, system-ui, sans-serif
    body: Inter, system-ui, sans-serif

# Every page renders inside Site unless it says otherwise.
layout: Site

components:
  # --- Layout -----------------------------------------------------------------
  Site:
    root:
      type: frame
      minHeight: screen
      fill: slate-950
      color: white
      children:
        - type: Navbar
        - type: frame
          tag: main
          height: fill
          children:
            - type: slot
        - type: Footer

  Navbar:
    root:
      type: frame
      tag: nav
      layout: { align: center, padding: [16, 32] }
      fill: slate-950/80
      border: { color: white/5, sides: bottom }
      className: sticky top-0 z-50 backdrop-blur-md
      responsive:
        phone:
          layout: { padding: [16, 16] }
      children:
        - type: frame
          width: 100%
          maxWidth: 1280
          layout: { direction: row, justify: between, align: center }
          children:
            - type: link
              href: /
              content: Nova
              font: { size: 20, weight: 700 }
            - type: frame
              layout: { direction: row, gap: 24, align: center }
              responsive:
                phone: { hidden: true }
              children:
                - { type: link, href: /#features, content: Features, className: hover:opacity-80 transition-opacity }
                - { type: link, href: /pricing, content: Pricing, className: hover:opacity-80 transition-opacity }
                - { type: link, href: /changelog, content: Changelog, className: hover:opacity-80 transition-opacity }
                - { type: link, href: https://docs.example.com, content: Docs, className: hover:opacity-80 transition-opacity }

  Footer:
    root:
      type: frame
      tag: footer
      layout: { align: center, padding: [32, 32] }
      color: slate-500
      border: { color: white/5, sides: top }
      children:
        - type: frame
          width: 100%
          maxWidth: 1280
          layout: { gap: 16 }
          children:
            - type: frame
              layout: { direction: row, gap: 24, wrap: true }
              children:
                - { type: link, href: https://github.com, content: GitHub, className: hover:opacity-80 transition-opacity }
                - { type: link, href: https://discord.gg, content: Discord, className: hover:opacity-80 transition-opacity }
                - { type: link, href: https://twitter.com, content: Twitter, className: hover:opacity-80 transition-opacity }
                - { type: link, href: /privacy, content: Privacy, className: hover:opacity-80 transition-opacity }
                - { type: link, href: /terms, content: Terms, className: hover:opacity-80 transition-opacity }
            - type: text
              content: © 2026 Nova Labs. Built with Neucli.
              opacity: 0.6

  # --- Blocks -------------------------------------------------------------------
  Hero:
    props:
      title: text
      subtitle: text
    root:
      type: frame
      tag: section
      layout: { align: center, padding: [96, 32] }
      responsive:
        phone:
          layout: { padding: [64, 16] }
      children:
        - type: frame
          width: 100%
          maxWidth: 1280
          layout: { align: center, gap: 24 }
          font: { align: center }
          children:
            - type: text
              tag: h1
              content: '{title}'
              font: { size: 48, weight: 700, tracking: -0.025 }
              responsive:
                phone:
                  font: { size: 36 }
            - type: text
              content: '{subtitle}'
              font: { size: 20 }
              opacity: 0.9
            - type: frame
              layout: { direction: row, gap: 16, justify: center, wrap: true, padding: [16, 0, 0, 0] }
              children:
                - type: slot

  # Centered, padded content column. Backgrounds come from the instance's className.
  Section:
    root:
      type: frame
      tag: section
      layout: { align: center, padding: [64, 32] }
      responsive:
        phone:
          layout: { padding: [48, 16] }
      children:
        - type: frame
          width: 100%
          maxWidth: 1280
          layout: { gap: 32 }
          children:
            - type: slot

  SectionTitle:
    props:
      title: text
    root:
      type: text
      tag: h2
      content: '{title}'
      font: { size: 30, weight: 700 }

  Card:
    props:
      title: text
      description: text
    root:
      type: frame
      layout: { gap: 8, padding: 24 }
      fill: slate-900
      radius: 16
      border: { color: white/10 }
      clip: true
      children:
        - type: text
          tag: h3
          content: '{title}'
          font: { size: 20, weight: 600 }
        - type: text
          content: '{description}'
          opacity: 0.8
        - type: slot

  Stat:
    props:
      value: text
      label: text
    root:
      type: frame
      layout: { align: center, gap: 8 }
      children:
        - type: text
          content: '{value}'
          font: { size: 48, weight: 700 }
          fill: { gradient: to-br, from: violet-400, to: cyan-400 }
          className: bg-clip-text text-transparent
        - type: text
          content: '{label}'
          color: white/40
          font: { size: 12, transform: uppercase, tracking: 0.2 }

  Faq:
    props:
      question: text
      answer: text
    root:
      type: frame
      layout: { gap: 8 }
      children:
        - type: text
          tag: h3
          content: '{question}'
          font: { size: 16, weight: 600 }
        - type: text
          content: '{answer}'
          color: white/60
          font: { size: 14, leading: 1.625 }

  # The accent (border + version color) comes from the instance's className.
  Release:
    props:
      version: text
      title: text
      body: text
    root:
      type: frame
      layout: { gap: 12, padding: [0, 0, 0, 24] }
      border: { width: 2, sides: left }
      children:
        - type: text
          content: '{version}'
          font: { family: mono, size: 12, transform: uppercase, tracking: 0.2 }
        - type: text
          tag: h3
          content: '{title}'
          color: white
          font: { size: 24, weight: 700 }
        - type: text
          content: '{body}'
          color: white/60
          font: { leading: 1.625 }

pages:
  - path: /
    name: Home
    title: Nova - Ship product-grade sites in minutes
    description: A design-forward toolkit for teams who care about craft.
    sections:
      - type: Hero
        fill: { gradient: to-b, from: violet-600/20, via: slate-950, to: slate-950 }
        props:
          title: Websites, without the chaos.
          subtitle: Nova turns a single YAML file into a production React site. Opinionated defaults, full control when you need it.
        children:
          - type: link
            href: /pricing
            content: Start building
            layout: { padding: [14, 28] }
            fill: white
            color: slate-900
            radius: full
            font: { weight: 600 }
            shadow: { size: xl, color: violet-500/30 }
            className: hover:shadow-violet-500/50 transition
          - type: link
            href: '#'
            content: Read the docs
            layout: { padding: [14, 28] }
            radius: full
            border: { color: white/20 }
            font: { weight: 500 }
            className: hover:bg-white/5 transition

      - type: Section
        children:
          - type: frame
            layout: { direction: grid, columns: 5, align: center, gap: 24 }
            responsive:
              tablet: { layout: { columns: 3 } }
              phone: { layout: { columns: 2 } }
            children:
              - type: text
                content: Trusted by teams at
                color: white/30
                font: { family: mono, size: 12, transform: uppercase, tracking: 0.2 }
              - { type: text, content: Linear, color: white/60, font: { size: 14, weight: 600, align: center } }
              - { type: text, content: Vercel, color: white/60, font: { size: 14, weight: 600, align: center } }
              - { type: text, content: Stripe, color: white/60, font: { size: 14, weight: 600, align: center } }
              - { type: text, content: Framer, color: white/60, font: { size: 14, weight: 600, align: center } }

      - type: Section
        id: features
        children:
          - type: frame
            layout: { gap: 16 }
            children:
              - type: SectionTitle
                props: { title: Built for shipping }
              - type: text
                content: Stop fighting your tools. Nova gives you the primitives to go from zero to polished in an afternoon, not a sprint.
                color: white/60
                maxWidth: 672
                font: { size: 18 }
          - type: frame
            layout: { direction: grid, columns: 3, gap: 24 }
            responsive:
              tablet: { layout: { columns: 2 } }
              phone: { layout: { columns: 1 } }
            children:
              - type: Card
                className: hover:border-violet-500/40 transition
                props:
                  title: Zero config
                  description: Import YAML. Nova handles routing, theming, and deployment. No build configs to babysit.
              - type: Card
                className: hover:border-cyan-500/40 transition
                props:
                  title: Design tokens, live
                  description: Define colors and fonts once. Nova wires them up as CSS variables and every block uses them.
              - type: Card
                className: hover:border-pink-500/40 transition
                props:
                  title: Fully typed
                  description: Every block, every prop, every theme token. TypeScript types ship with every release.

      - type: Section
        fill: slate-900
        border: { sides: y, color: white/5 }
        children:
          - type: frame
            layout: { direction: grid, columns: 4, gap: 24 }
            responsive:
              phone: { layout: { columns: 2, gap: [40, 24] } }
            children:
              - { type: Stat, props: { value: 10×, label: Faster to ship } }
              - { type: Stat, props: { value: 99.99%, label: Edge uptime } }
              - { type: Stat, props: { value: <40ms, label: Median TTFB } }
              - { type: Stat, props: { value: 2k+, label: Sites in production } }

      - type: Section
        children:
          - type: SectionTitle
            props: { title: Composition over configuration }
          - type: frame
            layout: { direction: grid, columns: 2, gap: 48, align: center }
            responsive:
              phone: { layout: { columns: 1 } }
            children:
              - type: frame
                layout: { gap: 20 }
                children:
                  - type: text
                    content: Every piece of the page is a block. Every block is a line of YAML. Drop them in, rearrange, theme them, and you have a site that would take a week to write by hand.
                    color: white/70
                    font: { size: 20, leading: 1.625 }
                  - type: text
                    content: Blocks compose. Themes cascade. Deploys are instant. It is the web stack you wish you already had.
                    color: white/40
                    font: { size: 14, leading: 1.625 }
                  - type: link
                    href: '#'
                    content: See it in action
                    width: hug
                    layout: { padding: [12, 24] }
                    fill: violet-500
                    radius: full
                    font: { weight: 500 }
                    className: hover:bg-violet-400 transition
              - type: image
                src: https://placehold.co/900x700/0f172a/7c3aed/png?text=%3C%2F%3E
                alt: Nova editor preview
                width: fill
                radius: 16
                border: { color: white/10 }
                shadow: { size: 2xl, color: black/50 }

      - type: Section
        fill: { gradient: to-br, from: violet-600, via: indigo-600, to: cyan-500 }
        children:
          - type: frame
            layout: { align: center, gap: 24 }
            font: { align: center }
            children:
              - type: SectionTitle
                props: { title: Start shipping today. }
              - type: text
                content: Free forever for indie projects. Two minutes to your first deploy. No credit card. No nonsense.
                color: white/90
                maxWidth: 576
                font: { size: 20 }
              - type: frame
                layout: { direction: row, gap: 16, justify: center, wrap: true }
                children:
                  - type: link
                    href: /pricing
                    content: Get started free
                    layout: { padding: [14, 32] }
                    fill: white
                    color: violet-700
                    radius: full
                    font: { weight: 700 }
                    shadow: { size: xl, color: black/10 }
                    className: hover:bg-violet-50 transition
                  - type: link
                    href: '#'
                    content: Talk to us
                    layout: { padding: [14, 32] }
                    radius: full
                    border: { color: white/40 }
                    font: { weight: 600 }
                    className: hover:bg-white/10 transition

  - path: /pricing
    name: Pricing
    title: Pricing - Nova
    description: Simple pricing. Start free, scale when you are ready.
    sections:
      - type: Hero
        props:
          title: Simple pricing. No surprises.
          subtitle: Start free. Upgrade when you outgrow it. Downgrade whenever you want.
      - type: Section
        children:
          - type: frame
            layout: { direction: grid, columns: 3, gap: 24 }
            responsive:
              tablet: { layout: { columns: 2 } }
              phone: { layout: { columns: 1 } }
            children:
              - type: Card
                props:
                  title: Hobby
                  description: For weekend projects and personal sites. One project, community support, all core blocks.
                children:
                  - type: text
                    content: $0
                    font: { size: 36, weight: 700 }
                  - type: link
                    href: '#'
                    content: Start free
                    layout: { padding: [12, 24], align: center }
                    fill: white/10
                    radius: 8
                    font: { weight: 600 }
                    className: hover:bg-white/15 transition
              - type: Card
                fill: { gradient: to-br, from: violet-600, to: indigo-700 }
                className: shadow-2xl shadow-violet-500/20
                props:
                  title: Pro
                  description: Unlimited projects, custom domains, priority support, and the shiny analytics dashboard.
                children:
                  - type: frame
                    children:
                      - type: text
                        content: $19
                        font: { size: 36, weight: 700 }
                      - type: text
                        content: per month, billed annually
                        color: white/70
                        font: { size: 14 }
                  - type: link
                    href: '#'
                    content: Start 14-day trial
                    layout: { padding: [12, 24], align: center }
                    fill: white
                    color: violet-700
                    radius: 8
                    font: { weight: 700 }
                    className: hover:bg-violet-50 transition
              - type: Card
                props:
                  title: Team
                  description: Everything in Pro plus SSO, audit logs, dedicated support, and a signed SLA.
                children:
                  - type: text
                    content: Custom
                    font: { size: 36, weight: 700 }
                  - type: link
                    href: '#'
                    content: Contact sales
                    layout: { padding: [12, 24], align: center }
                    fill: white/10
                    radius: 8
                    font: { weight: 600 }
                    className: hover:bg-white/15 transition
      - type: Section
        border: { sides: top, color: white/5 }
        children:
          - type: SectionTitle
            props: { title: Frequently asked }
          - type: frame
            layout: { direction: grid, columns: 2, gap: 32 }
            responsive:
              phone: { layout: { columns: 1 } }
            children:
              - type: Faq
                props:
                  question: What happens when I upgrade?
                  answer: Your workspace unlocks the Pro feature set the second you switch plans. No deploy, no migration, no fuss.
              - type: Faq
                props:
                  question: Is there a free tier forever?
                  answer: Yes. One project, community support, no time limit. Perfect for indie hackers and side projects.
              - type: Faq
                props:
                  question: Can I self-host?
                  answer: The CLI is MIT licensed. Deploy anywhere that runs Node. Our cloud is just the easy-mode button.
              - type: Faq
                props:
                  question: Do you offer refunds?
                  answer: Within 30 days, no questions asked. Email hello@nova.dev and it is done.

  - path: /changelog
    name: Changelog
    title: Changelog - Nova
    description: Everything we shipped, in reverse chronological order.
    sections:
      - type: Hero
        props:
          title: What is new.
          subtitle: Every release, every tweak. The full history of how Nova got to today.
      - type: Section
        children:
          - type: frame
            layout: { align: center }
            children:
              - type: frame
                width: 100%
                maxWidth: 768
                layout: { gap: 40 }
                children:
                  - type: Release
                    border: { color: violet-500/60 }
                    color: violet-400
                    props:
                      version: v2.0  -  Apr 21, 2026
                      title: The great redesign
                      body: A ground-up rewrite of the editor around a block registry, a Zustand store, and a proper design-token system. 40% smaller bundle, instant undo, and a preview that finally matches production.
                  - type: Release
                    border: { color: cyan-500/60 }
                    color: cyan-400
                    props:
                      version: v1.8  -  Mar 02, 2026
                      title: Keyboard everything
                      body: Undo, redo, duplicate, copy, paste, export, escape. Every motion-critical action now has a shortcut. Mouse optional.
                  - type: Release
                    border: { color: pink-500/60 }
                    color: pink-400
                    props:
                      version: v1.6  -  Jan 14, 2026
                      title: Design tokens, live
                      body: Define colors and fonts in the left sidebar, apply them from the right. CSS variables under the hood, so theming is free.
                  - type: Release
                    border: { color: white/10 }
                    color: white/40
                    props:
                      version: v1.0  -  Sep 09, 2025
                      title: Nova is here
                      body: First public release. Four block types, two themes, one terrible logo. We have fixed two of those.
